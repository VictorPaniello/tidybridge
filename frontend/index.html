<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tidybridge</title>
    <script>
      // Blocking, runs before first paint - avoids a flash of the wrong
      // theme that a React effect (which only runs after mount) couldn't
      // prevent. Same localStorage key ThemeToggle.tsx reads/writes.
      (function () {
        // One-time handoff from the landing page's "Get started" link
        // (marketing/src/App.tsx) - localStorage can't cross origins, so
        // it passes the theme via the URL instead. Persisted here so it
        // behaves like a normal preference from now on, then stripped
        // from the URL so a later manual toggle isn't overridden if this
        // exact link ever gets revisited.
        var params = new URLSearchParams(location.search);
        var handoff = params.get("theme");
        if (handoff === "dark" || handoff === "light") {
          localStorage.setItem("theme", handoff);
          params.delete("theme");
          var query = params.toString();
          history.replaceState(null, "", location.pathname + (query ? "?" + query : "") + location.hash);
        }

        var stored = localStorage.getItem("theme");
        var dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
