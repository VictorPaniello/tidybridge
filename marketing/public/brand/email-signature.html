<!doctype html>
<!--
  Gmail signature. Gmail doesn't take HTML directly: open
  https://tidybridge.dev/brand/email-signature.html in the browser, select
  the signature below (Ctrl+A), copy, and paste it into Gmail → Settings →
  General → Signature, on the signature for hello@tidybridge.dev.
  The logo is loaded from tidybridge.dev, so it shows in every email client.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>tidybridge email signature</title>
  </head>
  <body>
    <table cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, Helvetica, sans-serif; font-size: 13px; line-height: 1.4; color: #1c1917">
      <tr>
        <td style="padding-right: 12px; vertical-align: top">
          <img src="https://tidybridge.dev/brand/mark-tile-64.png" width="32" height="32" alt="tidybridge" style="display: block; border-radius: 7px" />
        </td>
        <td style="vertical-align: top">
          <strong>Victor Paniello</strong><br />
          <span style="color: #1c1917">tidy</span><span style="color: #047857">bridge</span>
          <span style="color: #57534e"> · supplier invoices, cleaned and checked</span><br />
          <a href="mailto:hello@tidybridge.dev" style="color: #047857; text-decoration: none">hello@tidybridge.dev</a>
          <span style="color: #57534e"> · </span>
          <a href="https://tidybridge.dev" style="color: #047857; text-decoration: none">tidybridge.dev</a>
        </td>
      </tr>
    </table>
  </body>
</html>
