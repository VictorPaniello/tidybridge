    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "tidybridge",
        "url": "https://tidybridge.dev",
        "description": "Cleans messy client data exports and delivers them to downstream systems via webhooks and SCIM-shaped provisioning, with full retry and audit trails.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web"
      }
    </script>
    <script>
      // Blocking, runs before first paint - avoids a flash of the wrong
      // theme. Same localStorage key ThemeToggle.tsx reads/writes. Copied
      // from frontend/index.html - this site and the app are different
      // origins, so the two never share this localStorage value, only
      // the same logic for using it.
      (function () {
        var stored = localStorage.getItem("theme");
        var dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
