<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="How tidybridge handles personal data: what it collects, why, who processes it and your rights." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://tidybridge.dev/privacy" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)" />
    <title>Privacy policy - tidybridge</title>
    <script>
      // Blocking, runs before first paint - avoids a flash of the wrong
      // theme. Same localStorage key ThemeToggle.tsx reads/writes. Copied
      // from frontend/index.html - this site and the app are different
      // origins, so the two never share this localStorage value, only
      // the same logic for using it.
      (function () {
        var stored = localStorage.getItem("theme");
        var dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
    </head>
  <body>
    <div id="root" data-page="privacy"></div>
    <script type="module" src="/src/legal/main.tsx"></script>
  </body>
</html>
